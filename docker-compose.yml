# Local development stack for the Sitar al Jannah WordPress store.
#   docker compose up -d        # start WordPress on http://localhost:8080
#   ./bin/setup.sh              # first run only: install WP, WooCommerce, theme and demo content
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sitaraljannah}
      MARIADB_USER: ${DB_USER:-sitaraljannah}
      MARIADB_PASSWORD: ${DB_PASSWORD:-sitaraljannah}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-sitaraljannah}
      WORDPRESS_DB_USER: ${DB_USER:-sitaraljannah}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-sitaraljannah}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
    volumes:
      - wp_data:/var/www/html
      - ./theme/sitaraljannah:/var/www/html/wp-content/themes/sitaraljannah

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-sitaraljannah}
      WORDPRESS_DB_USER: ${DB_USER:-sitaraljannah}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-sitaraljannah}
    volumes:
      - wp_data:/var/www/html
      - ./theme/sitaraljannah:/var/www/html/wp-content/themes/sitaraljannah
      - ./bin:/scripts:ro

volumes:
  db_data:
  wp_data:
